spring.application.name=orbit-crm-api
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orbit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orbit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orbit}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
