name: orbit-cn

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]

  api:
    build: ./backend/nest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://orbit:${POSTGRES_PASSWORD}@db:5432/orbit
      DIRECT_URL: postgresql://orbit:${POSTGRES_PASSWORD}@db:5432/orbit
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      APP_CORS_ALLOWED_ORIGINS: https://orbit.livegrc.chat
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      private:
      ingress:
        aliases: [orbit-cn-api]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on: [api]
    networks:
      ingress:
        aliases: [orbit-cn-web]

volumes:
  postgres-data:

networks:
  private:
  ingress:
    external: true
    name: heju-ingress
