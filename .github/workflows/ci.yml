name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/nest/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generates the client from the schema, which also fails the build if the
      # schema itself is invalid.
      - run: pnpm prisma generate

      - run: pnpm build

      # The e2e suite is deliberately not run here: it needs a real Postgres and
      # would either share the deployed database with every branch or require
      # provisioning one per run. Run it locally with `pnpm test:e2e`.

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          # Only needs to be a valid URL at build time; the real value comes
          # from the Vercel project.
          NEXT_PUBLIC_API_URL: https://orbit-crm-api.vercel.app/api
