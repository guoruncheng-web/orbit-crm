# Local stack: Postgres, the NestJS API and the Next.js frontend.
#
# The API applies pending migrations on boot, so `docker compose up --build`
# against an empty volume gives a working database without extra steps.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orbit-postgres:/var/lib/postgresql/data

  api:
    build: ./backend/nest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit}@db:5432/${POSTGRES_DB:-orbit}
      DIRECT_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit}@db:5432/${POSTGRES_DB:-orbit}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-do-not-use-in-production}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  orbit-postgres:
